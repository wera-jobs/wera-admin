name: Release

# release-please keeps a release PR open on main with the next version
# (from the Conventional Commits) and its CHANGELOG. Merging it tags the
# release; the admin image is then pushed to GitHub Container Registry.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    env:
      IMAGE: wera-jobs/wera-admin
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: APP_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/${{ env.IMAGE }}:${{ needs.release-please.outputs.tag }}
            ghcr.io/${{ env.IMAGE }}:latest
